<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="WebRTC tabanlı araç içi sesli iletişim ve konum paylaşım sistemi"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
         integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
         crossorigin=""/>
    
    <!-- Janus Gateway JavaScript Client -->
    <script src="https://cdn.jsdelivr.net/npm/janus-gateway@0.11.8/html/janus.js"></script>
    
    <!-- Disable WebSocket HMR errors in console -->
    <script>
      // Suppress WebSocket connection errors for /ws endpoint
      if (window.WebSocket) {
        const OriginalWebSocket = window.WebSocket;
        window.WebSocket = function(url, protocols) {
          // Ignore HMR WebSocket connections that fail
          if (url && url.includes('/ws')) {
            console.log('[HMR] WebSocket disabled for HTTPS mode');
            return {
              close: () => {},
              send: () => {},
              addEventListener: () => {},
              removeEventListener: () => {}
            };
          }
          return new OriginalWebSocket(url, protocols);
        };
      }
    </script>
    
    <title>CarVoice - Araç İçi Sesli İletişim</title>
  </head>
  <body>
    <noscript>Bu uygulamayı çalıştırmak için JavaScript'i etkinleştirmeniz gerekir.</noscript>
    <div id="root"></div>
    
    <!-- Eruda Mobile Debug Console (Sadece ?debug=true ile aktif) -->
    <script>
      // URL'de "debug=true" parametresi varsa Eruda'yı yükle
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('debug') === 'true') {
        const script = document.createElement('script');
        script.src = "https://cdn.jsdelivr.net/npm/eruda";
        script.onload = () => {
          eruda.init();
          console.log('🔧 Eruda Debug Console aktif! Sağ alt köşedeki ikona tıklayın.');
        };
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
